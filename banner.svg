<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Рыба-ёж, fullstack разработчик">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fffaf6"/>
      <stop offset="55%" stop-color="#fdf1f3"/>
      <stop offset="100%" stop-color="#f4f0fb"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc9d4" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffc9d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9e9de" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#c9e9de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9cdf7" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#d9cdf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffd9c4"/>
      <stop offset="100%" stop-color="#ffb3a7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b4258"/>
      <stop offset="100%" stop-color="#7a6a8f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9fb2"/>
      <stop offset="50%" stop-color="#c9b6f2"/>
      <stop offset="100%" stop-color="#9fd8c6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e7ccd6" fill-opacity=".55"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="30"/></clipPath>
    <style>
      .h { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .s { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .bob { animation: bob 5.5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .sway { animation: sway 7s ease-in-out infinite; transform-origin: 20px 12px; }
      @keyframes sway { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
      .drift1 { animation: drift1 16s ease-in-out infinite; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(24px,14px) } }
      .drift2 { animation: drift2 19s ease-in-out infinite; }
      @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-22px,-16px) } }
      .bub { animation: bub 6s linear infinite; }
      .bub2 { animation: bub 6s linear infinite 2s; }
      .bub3 { animation: bub 6s linear infinite 4s; }
      @keyframes bub {
        0%   { transform: translateY(0) scale(.7); opacity: 0 }
        15%  { opacity: .85 }
        80%  { opacity: .35 }
        100% { transform: translateY(-120px) scale(1.15); opacity: 0 }
      }
      .wink { animation: wink 6s ease-in-out infinite; transform-origin: center; }
      @keyframes wink { 0%,92%,100% { transform: scaleY(1) } 96% { transform: scaleY(.1) } }
      .glow { animation: glow 4.5s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <g class="drift1"><ellipse cx="140" cy="60" rx="260" ry="170" fill="url(#blobA)"/></g>
    <g class="drift2"><ellipse cx="1090" cy="250" rx="280" ry="180" fill="url(#blobB)"/></g>
    <g class="drift1"><ellipse cx="760" cy="30" rx="240" ry="150" fill="url(#blobC)"/></g>
    <text class="h" x="80" y="132" font-size="66" font-weight="700" fill="url(#ink)" letter-spacing="-0.5">Рыба-ёж</text>
    <rect x="82" y="152" width="168" height="5" rx="3" fill="url(#rule)" class="glow"/>
    <text class="s" x="82" y="200" font-size="25" font-weight="600" fill="#6f6383">fullstack разработчик</text>
    <text class="s" x="82" y="234" font-size="19" fill="#95899f">интерфейсы, сервисы, боты и немного игр</text>
    <g class="s" font-size="14" font-weight="600">
      <g>
        <rect x="82" y="252" width="96" height="27" rx="13" fill="#ffffff" fill-opacity=".8" stroke="#ffc3cf"/>
        <text x="130" y="270" fill="#a8607a" text-anchor="middle">Kotlin</text>
      </g>
      <g>
        <rect x="188" y="252" width="86" height="27" rx="13" fill="#ffffff" fill-opacity=".8" stroke="#c9b6f2"/>
        <text x="231" y="270" fill="#6f5da8" text-anchor="middle">Rust</text>
      </g>
      <g>
        <rect x="284" y="252" width="120" height="27" rx="13" fill="#ffffff" fill-opacity=".8" stroke="#9fd8c6"/>
        <text x="344" y="270" fill="#3f8a75" text-anchor="middle">TypeScript</text>
      </g>
      <g>
        <rect x="414" y="252" width="96" height="27" rx="13" fill="#ffffff" fill-opacity=".8" stroke="#ffd9a8"/>
        <text x="462" y="270" fill="#a87a3f" text-anchor="middle">Python</text>
      </g>
    </g>
    <g fill="#ffffff" fill-opacity=".9" stroke="#ffc3cf" stroke-width="1.5">
      <circle class="bub"  cx="905" cy="215" r="7"/>
      <circle class="bub2" cx="935" cy="230" r="5"/>
      <circle class="bub3" cx="880" cy="235" r="4"/>
    </g>
    <g transform="translate(950 60)"><g class="bob">
      <ellipse cx="90" cy="180" rx="66" ry="10" fill="#e6c9d3" fill-opacity=".45"/>
      <g transform="translate(6 78)"><g class="sway">
        <path d="M18 12 C-6 -8 -22 2 -18 14 C-22 26 -6 34 18 16 Z" fill="#ffc2b3"/>
      </g></g>
      <g fill="#ffc2b3">
        <path d="M90 2 l11 20 -22 0 Z"/>
        <path d="M148 22 l20 8 -16 14 Z"/>
        <path d="M168 84 l22 2 -18 16 Z"/>
        <path d="M144 142 l20 12 -24 8 Z"/>
        <path d="M88 168 l12 22 -24 -2 Z"/>
        <path d="M34 146 l4 22 -22 -10 Z"/>
      </g>
      <circle cx="92" cy="86" r="78" fill="url(#body)"/>
      <circle cx="92" cy="86" r="78" fill="none" stroke="#ff9f92" stroke-opacity=".5" stroke-width="2"/>
      <ellipse cx="92" cy="112" rx="52" ry="38" fill="#fff3ea" fill-opacity=".9"/>
      <path d="M150 96 C176 86 182 108 160 118 C150 122 146 110 150 96 Z" fill="#ffd0bf"/>
      <circle cx="58" cy="102" r="11" fill="#ff9fb2" fill-opacity=".45"/>
      <circle cx="126" cy="102" r="11" fill="#ff9fb2" fill-opacity=".45"/>
      <g class="wink">
        <circle cx="66" cy="76" r="10" fill="#4b4258"/>
        <circle cx="69" cy="72" r="3.4" fill="#ffffff"/>
      </g>
      <g class="wink">
        <circle cx="118" cy="76" r="10" fill="#4b4258"/>
        <circle cx="121" cy="72" r="3.4" fill="#ffffff"/>
      </g>
      <path d="M80 100 q12 12 24 0" fill="none" stroke="#4b4258" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="#ff9f92" fill-opacity=".45">
        <circle cx="92" cy="40" r="3"/>
        <circle cx="116" cy="50" r="2.4"/>
        <circle cx="68" cy="50" r="2.4"/>
      </g>
    </g></g>
    <rect x="1" y="1" width="1198" height="298" rx="30" fill="none" stroke="#f0d7e0" stroke-width="2"/>
  </g>
</svg>
