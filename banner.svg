<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Рыба-ёж, fullstack разработчик">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#07101f"/>
      <stop offset="55%" stop-color="#0b1a33"/>
      <stop offset="100%" stop-color="#0d2445"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="26"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .cursor { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse cx="200" cy="80" rx="320" ry="200" fill="url(#glowA)"/>
    <ellipse cx="1020" cy="250" rx="340" ry="210" fill="url(#glowB)"/>
    <text class="t" x="78" y="128" font-size="72" font-weight="800" fill="url(#title)" filter="url(#soft)" opacity="0.5">Рыба-ёж</text>
    <text class="t" x="78" y="128" font-size="72" font-weight="800" fill="url(#title)">Рыба-ёж</text>
    <rect x="80" y="146" width="196" height="4" rx="2" fill="url(#bar)" class="pulse"/>
    <text class="t" x="80" y="192" font-size="24" font-style="italic" font-weight="600" fill="#9fd8f7">«Если вы можете это представить, я смогу это реализовать»</text>
    <text class="m" x="80" y="230" font-size="17" fill="#7f96b8" letter-spacing="1">fullstack разработчик<tspan fill="#38bdf8"> // </tspan>бэкенд<tspan fill="#38bdf8"> // </tspan>интерфейсы<tspan fill="#38bdf8"> // </tspan>свои AI-системы</text>
    <text class="m" x="80" y="268" font-size="17" fill="#64789a"><tspan fill="#22d3ee">$</tspan> <tspan fill="#c7d8ef">build --stack python,kotlin,java,typescript --ai own-systems</tspan><tspan class="cursor" fill="#7dd3fc"> _</tspan></text>

    <g transform="translate(900 62)" opacity="0.95">
      <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65">
        <rect x="0" y="58" width="54" height="54" rx="6"/>
        <rect x="62" y="58" width="54" height="54" rx="6"/>
        <rect x="124" y="58" width="54" height="54" rx="6"/>
        <rect x="31" y="0" width="54" height="54" rx="6"/>
        <rect x="93" y="0" width="54" height="54" rx="6"/>
        <rect x="62" y="116" width="54" height="54" rx="6"/>
      </g>
      <g fill="#38bdf8">
        <rect x="31" y="0" width="54" height="54" rx="6" opacity="0.14"/>
        <rect x="62" y="58" width="54" height="54" rx="6" opacity="0.22"/>
        <rect x="62" y="116" width="54" height="54" rx="6" opacity="0.1"/>
      </g>
      <g fill="#7dd3fc">
        <circle cx="58" cy="85" r="3.6" class="pulse"/>
        <circle cx="120" cy="27" r="3.6" class="pulse"/>
        <circle cx="89" cy="143" r="3.6" class="pulse"/>
      </g>
    </g>
    <rect x="1" y="1" width="1198" height="298" rx="26" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  </g>
</svg>
