<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Рыба-ёж — fullstack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="55%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#120b22"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#7c3aed" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="24"/>
    </clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
      .drift { animation: drift 14s linear infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-40px) } }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-420px) } 100% { transform: translateX(1280px) } }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      .float1 { animation: float1 9s ease-in-out infinite; }
      @keyframes float1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(14px,-12px) } }
      .float2 { animation: float2 11s ease-in-out infinite; }
      @keyframes float2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-16px,10px) } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g class="drift"><rect x="-60" y="0" width="1320" height="320" fill="url(#grid)"/></g>
    <ellipse class="float1" cx="215" cy="120" rx="300" ry="190" fill="url(#glowA)"/>
    <ellipse class="float2" cx="1010" cy="235" rx="320" ry="200" fill="url(#glowB)"/>
    <g class="sweep" opacity="0.5">
      <rect x="0" y="0" width="160" height="320" fill="url(#fade)" opacity="0.25" filter="url(#soft)"/>
    </g>
    <text class="t" x="72" y="150" font-size="82" font-weight="800" fill="url(#neon)" filter="url(#softer)" opacity="0.65">Рыба-ёж</text>
    <text class="t" x="72" y="150" font-size="82" font-weight="800" fill="url(#neon)">Рыба-ёж</text>
    <text class="m" x="76" y="196" font-size="23" fill="#8b93b8" letter-spacing="1.5">
      fullstack dev<tspan fill="#a855f7"> // </tspan>systems<tspan fill="#22d3ee"> × </tspan>web<tspan fill="#a855f7"> × </tspan>gamedev<tspan fill="#22d3ee"> × </tspan>AI
    </text>
    <text class="m" x="76" y="252" font-size="19" fill="#4b5578">
      <tspan fill="#22d3ee">$</tspan> <tspan fill="#c9d1d9">build --stack rust,cpp,kotlin,python,ts --mode fullstack</tspan><tspan class="blink" fill="#f472b6"> _</tspan>
    </text>
    <rect x="72" y="278" width="220" height="3" rx="2" fill="url(#neon)" class="pulse"/>
    <rect x="304" y="278" width="80" height="3" rx="2" fill="#22d3ee" opacity="0.4"/>
    <g transform="translate(880 70)" opacity="0.95"><g class="float1">
      <g fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.75">
        <rect x="0" y="60" width="56" height="56" rx="6"/>
        <rect x="64" y="60" width="56" height="56" rx="6"/>
        <rect x="128" y="60" width="56" height="56" rx="6"/>
        <rect x="32" y="0" width="56" height="56" rx="6"/>
        <rect x="96" y="0" width="56" height="56" rx="6"/>
        <rect x="64" y="120" width="56" height="56" rx="6"/>
      </g>
      <g fill="#22d3ee">
        <rect x="32" y="0" width="56" height="56" rx="6" opacity="0.14"/>
        <rect x="64" y="60" width="56" height="56" rx="6" opacity="0.2"/>
        <rect x="64" y="120" width="56" height="56" rx="6" opacity="0.1"/>
      </g>
      <g fill="#f472b6">
        <circle cx="60" cy="88" r="4" class="pulse"/>
        <circle cx="124" cy="28" r="4" class="pulse"/>
        <circle cx="92" cy="148" r="4" class="pulse"/>
      </g>
    </g></g>
    <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
