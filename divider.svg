<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" role="presentation">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc3cf" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffc3cf" stop-opacity=".9"/>
      <stop offset="52%" stop-color="#c9b6f2" stop-opacity=".9"/>
      <stop offset="80%" stop-color="#9fd8c6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#9fd8c6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .soft { animation: soft 8s ease-in-out infinite }
      @keyframes soft { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      .walk { animation: walk 14s ease-in-out infinite }
      @keyframes walk { 0% { transform: translateX(120px) } 50% { transform: translateX(1080px) } 100% { transform: translateX(120px) } }
    </style>
  </defs>
  <rect x="0" y="7" width="1200" height="1.6" rx="1" fill="url(#dg)" class="soft"/>
  <g class="walk">
    <circle cx="0" cy="8" r="4" fill="#fff6f8" stroke="#ffb3c4" stroke-width="1.4"/>
  </g>
</svg>
